<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZ 足球球员数据库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background: url('assets/bg-stadium.jpg') center/cover fixed no-repeat;
            color: #e8f0ff;
            min-height: 100vh;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: linear-gradient(180deg, rgba(10, 25, 60, 0.85) 0%, rgba(10, 25, 60, 0.95) 100%);
            z-index: -1;
        }

        /* yz 徽章 */
        .yz-badge {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            z-index: 999;
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 70px 20px 40px;
        }

        .hero h1 {
            font-size: 44px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #60a5fa, #3b82f6, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 18px;
            color: #93c5fd;
        }

        /* 搜索框 */
        .search-wrapper {
            max-width: 600px;
            margin: 0 auto 40px;
            padding: 0 20px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            background: rgba(30, 58, 138, 0.4);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 16px;
            padding: 8px;
            backdrop-filter: blur(10px);
        }

        #search-input {
            flex: 1;
            padding: 14px 16px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        #search-input::placeholder {
            color: #64748b;
        }

        #search-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        #search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.5);
        }

        /* 球员卡片网格 */
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .player-card {
            background: rgba(30, 58, 138, 0.5);
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .player-card:hover {
            transform: translateY(-8px);
            border-color: rgba(96, 165, 250, 0.6);
            box-shadow: 0 12px 40px rgba(59, 130, 246, 0.2);
        }

        .player-img-wrap {
            height: 220px;
            overflow: hidden;
        }

        .player-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .player-info {
            padding: 20px;
        }

        .player-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .player-club {
            font-size: 15px;
            color: #60a5fa;
            margin-bottom: 12px;
        }

        .player-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .meta-tag {
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #bfdbfe;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 60px 20px 40px;
            color: #64748b;
            font-size: 14px;
        }

        footer .yz {
            font-size: 20px;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 8px;
        }

        /* 移动端 */
        @media (max-width: 768px) {
            .hero h1 { font-size: 32px; }
            .search-box { flex-direction: column; }
            #search-btn { width: 100%; }
            .players-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="yz-badge">yz</div>

    <div class="hero">
        <h1>YZ 足球球员数据库</h1>
        <p>传奇球星 · 现役巨星 · 数据一览</p>
    </div>

    <div class="search-wrapper">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="搜索球员名字...">
            <button id="search-btn">搜索</button>
        </div>
    </div>

    <div class="players-grid" id="container"></div>

    <footer>
        <div class="yz">yz</div>
        <p>足球球员数据中心 · 个人作品</p>
    </footer>

    <script>
        // 固定展示的知名球员
        const playerList = [
            {
                name: "梅西",
                club: "迈阿密国际",
                league: "美职联",
                position: "前锋",
                age: 37,
                value: "3500万欧",
                photo: "assets/messi.jpg"
            },
            {
                name: "C罗",
                club: "利雅得胜利",
                league: "沙特联",
                position: "前锋",
                age: 40,
                value: "1200万欧",
                photo: "assets/ronaldo.jpg"
            },
            {
                name: "哈兰德",
                club: "曼城",
                league: "英超",
                position: "前锋",
                age: 25,
                value: "1.8亿欧",
                photo: "assets/haaland.jpg"
            },
            {
                name: "姆巴佩",
                club: "皇家马德里",
                league: "西甲",
                position: "前锋",
                age: 26,
                value: "1.6亿欧",
                photo: "assets/mbappe.jpg"
            },
            {
                name: "贝林厄姆",
                club: "皇家马德里",
                league: "西甲",
                position: "中场",
                age: 21,
                value: "1.5亿欧",
                photo: "assets/bellingham.jpg"
            },
            {
                name: "凯恩",
                club: "拜仁慕尼黑",
                league: "德甲",
                position: "前锋",
                age: 31,
                value: "7500万欧",
                photo: "assets/kane.jpg"
            },
            {
                name: "劳塔罗",
                club: "国际米兰",
                league: "意甲",
                position: "前锋",
                age: 27,
                value: "8000万欧",
                photo: "assets/lautaro.jpg"
            }
        ];

        const container = document.getElementById("container");
        const input = document.getElementById("search-input");
        const btn = document.getElementById("search-btn");

        function render(list) {
            if (list.length === 0) {
                container.innerHTML = `<p style="text-align:center;width:100%;opacity:0.7;font-size:18px;">没有找到该球员</p>`;
                return;
            }
            container.innerHTML = list.map(p => `
                <div class="player-card">
                    <div class="player-img-wrap">
                        <img class="player-img" src="${p.photo}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div style=&quot;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;&quot;>⚽</div>'">
                    </div>
                    <div class="player-info">
                        <div class="player-name">${p.name}</div>
                        <div class="player-club">${p.club} · ${p.league}</div>
                        <div class="player-meta">
                            <span class="meta-tag">${p.position}</span>
                            <span class="meta-tag">${p.age}岁</span>
                            <span class="meta-tag">身价 ${p.value}</span>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        function searchPlayer() {
            const kw = input.value.trim().toLowerCase();
            if (!kw) {
                render(playerList);
                return;
            }
            const result = playerList.filter(p => 
                p.name.toLowerCase().includes(kw) || 
                p.club.toLowerCase().includes(kw)
            );
            render(result);
        }

        btn.onclick = searchPlayer;
        input.onkeydown = (e) => e.key === "Enter" && searchPlayer();
        input.oninput = () => {
            if (input.value.trim() === "") render(playerList);
        };

        // 默认显示全部球员
        render(playerList);
    </script>

</body>
</html>

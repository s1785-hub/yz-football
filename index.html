<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZ 足球球员查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(rgba(10, 25, 55, 0.88), rgba(10, 25, 55, 0.92)),
                        url("assets/stadium-bg.jpg") center/cover no-repeat fixed;
            color: #fff;
            padding: 28px 16px;
            min-height: 100vh;
        }
        .yz-badge {
            position: fixed;
            top: 18px;
            right: 18px;
            background: #2563eb;
            color: #fff;
            font-weight: 800;
            padding: 7px 14px;
            border-radius: 999px;
            box-shadow: 0 0 14px rgba(37, 99, 235, 0.5);
            z-index: 99;
        }
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header h1 {
            font-size: 34px;
            background: linear-gradient(90deg, #60a5fa, #93c5fd);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.75;
            font-size: 16px;
        }
        .search-box {
            max-width: 620px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
        }
        #search-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(147, 197, 253, 0.3);
            font-size: 17px;
            background: rgba(30, 41, 59, 0.7);
            color: #fff;
            outline: none;
            backdrop-filter: blur(8px);
        }
        #search-input:focus {
            box-shadow: 0 0 0 2px #3b82f6;
            border-color: #3b82f6;
        }
        #search-btn {
            padding: 0 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #search-btn:hover {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
        }
        .tips-text {
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
            opacity: 0.7;
        }
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 24px;
            max-width: 1240px;
            margin: 0 auto;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            overflow: hidden;
            transition: 0.25s ease;
            border: 1px solid rgba(147, 197, 253, 0.15);
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            border-color: #3b82f6;
        }
        .avatar-wrap {
            height: 220px;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-body {
            padding: 18px;
        }
        .card-body h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .tag {
            display: inline-block;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 6px;
            margin-bottom: 6px;
        }
        .team-tag { background: rgba(59, 130, 246, 0.25); }
        .pos-tag { background: rgba(139, 92, 246, 0.25); }
        .value-tag { background: rgba(16, 185, 129, 0.25); }
        footer {
            text-align: center;
            margin-top: 70px;
            opacity: 0.55;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="yz-badge">YZ</div>
    <div class="header">
        <h1>⚽ YZ 足球球员查询系统</h1>
        <p>蓝色主题 · 联网实时搜索 · 本地球员兜底</p>
    </div>
    <div class="search-box">
        <input id="search-input" placeholder="输入球员名字：梅西、哈兰德、福登">
        <button id="search-btn">搜索</button>
    </div>
    <div class="tips-text" id="tip">输入名字搜索，清空输入框恢复全部球员</div>
    <div class="player-grid" id="container"></div>
    <footer>Powered by YZ | 足球数据演示项目</footer>

    <script>
        const container = document.getElementById("container");
        const input = document.getElementById("search-input");
        const btn = document.getElementById("search-btn");
        const tip = document.getElementById("tip");
        let timer = null;

        // 本地兜底球员库
        const localPlayers = [
            {name:"梅西",team:"迈阿密国际",pos:"前锋",value:"3500万欧",img:"assets/messi.jpg"},
            {name:"C罗",team:"利雅得胜利",pos:"前锋",value:"1200万欧",img:"assets/ronaldo.jpg"},
            {name:"哈兰德",team:"曼城",pos:"前锋",value:"1.8亿欧",img:"assets/haaland.jpg"},
            {name:"姆巴佩",team:"皇家马德里",pos:"前锋",value:"1.6亿欧",img:"assets/mbappe.jpg"},
            {name:"贝林厄姆",team:"皇家马德里",pos:"中场",value:"1.5亿欧",img:"assets/bellingham.jpg"},
            {name:"福登",team:"曼城",pos:"中场",value:"9000万欧",img:"assets/foden.jpg"},
            {name:"维尼修斯",team:"皇家马德里",pos:"前锋",value:"1.4亿欧",img:"assets/vinicius.jpg"}
        ];

        // 渲染球员卡片
        function render(list) {
            container.innerHTML = "";
            if (list.length === 0) {
                container.innerHTML = `<p style="text-align:center;width:100%;opacity:0.7;">没有找到该球员</p>`;
                return;
            }
            list.forEach(p => {
                const avatar = p.img || p.photo || "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Soccer_ball.svg/220px-Soccer_ball.svg.png";
                const name = p.name || p.name_zh || p.strPlayer;
                const team = p.team || p.strTeam || "未知球队";
                const pos = p.pos || p.strPosition || "未知位置";
                const value = p.value || "";
                container.innerHTML += `
                <div class="card">
                    <div class="avatar-wrap">
                        <img src="${avatar}" alt="${name}" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Soccer_ball.svg/220px-Soccer_ball.svg.png'">
                    </div>
                    <div class="card-body">
                        <h3>${name}</h3>
                        <span class="tag team-tag">${team}</span>
                        <span class="tag pos-tag">${pos}</span>
                        ${value ? `<span class="tag value-tag">💰${value}</span>` : ''}
                    </div>
                </div>`;
            });
        }

        // 联网搜索
        async function searchOnline(name) {
            try {
                tip.innerText = "🔍 正在联网查询...";
                const res = await fetch(`/.netlify/functions/proxy-football?q=${encodeURIComponent(name)}`);
                const data = await res.json();
                if (data && data.data && data.data.length > 0) {
                    tip.innerText = `✅ 联网找到 ${data.data.length} 位球员`;
                    render(data.data);
                } else {
                    tip.innerText = "❌ 未联网找到匹配球员";
                    render([]);
                }
            } catch (err) {
                tip.innerText = "⚠️ 联网失败，展示本地球员";
                const localResult = localPlayers.filter(item => item.name.includes(name));
                render(localResult);
            }
        }

        // 主搜索逻辑
        function doSearch() {
            const kw = input.value.trim();
            if (!kw) {
                render(localPlayers);
                tip.innerText = "输入名字搜索，清空输入框恢复全部球员";
                return;
            }
            const localResult = localPlayers.filter(item => item.name.includes(kw));
            if (localResult.length > 0) {
                render(localResult);
                tip.innerText = `📌 本地找到 ${localResult.length} 位球员`;
            } else {
                searchOnline(kw);
            }
        }

        // 防抖输入监听
        input.addEventListener("input", () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                doSearch();
                // 重点：删掉了 input.focus()，不再抢焦点！
            }, 300);
        });

        // 回车搜索
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                clearTimeout(timer);
                doSearch();
                // 重点：删掉了 input.focus()
            }
        });

        // 点击按钮搜索
        btn.addEventListener("click", () => {
            clearTimeout(timer);
            doSearch();
            // 重点：删掉了 input.focus()
        });

        // 页面加载默认显示本地球员
        render(localPlayers);
    </script>
</body>
</html>

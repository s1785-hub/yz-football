<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZ 足球球员数据库</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
        body {
            background: linear-gradient(rgba(10,25,60,0.85), rgba(10,25,60,0.95)), url('assets/bg-stadium.jpg') center/cover fixed no-repeat;
            color:#e8f0ff; min-height:100vh;
        }
        .yz-badge {
            position:fixed; top:20px; right:20px; width:50px; height:50px;
            background:linear-gradient(135deg,#3b82f6,#1d4ed8); border-radius:12px;
            display:flex; align-items:center; justify-content:center;
            font-size:20px; font-weight:800; color:#fff; z-index:999;
            box-shadow:0 4px 20px rgba(59,130,246,0.5);
        }
        .hero { text-align:center; padding:70px 20px 40px; }
        .hero h1 {
            font-size:44px; font-weight:800; margin-bottom:12px;
            background:linear-gradient(90deg,#60a5fa,#3b82f6,#93c5fd);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .hero p { font-size:18px; color:#93c5fd; }
        .search-wrapper { max-width:600px; margin:0 auto 20px; padding:0 20px; }
        .search-box {
            display:flex; gap:12px; background:rgba(30,58,138,0.4);
            border:1px solid rgba(96,165,250,0.3); border-radius:16px; padding:8px; backdrop-filter:blur(10px);
        }
        #search-input {
            flex:1; padding:14px 16px; border:none; background:transparent;
            color:#fff; font-size:16px; outline:none;
        }
        #search-input::placeholder { color:#64748b; }
        #search-btn {
            padding:14px 28px; border:none; border-radius:12px;
            background:linear-gradient(135deg,#3b82f6,#1d4ed8); color:#fff;
            font-size:16px; font-weight:600; cursor:pointer;
        }
        .tips-text { text-align:center; margin-bottom:20px; font-size:15px; opacity:0.7; }
        .players-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:24px; max-width:1200px; margin:0 auto; padding:0 20px;
        }
        .player-card {
            background:rgba(30,58,138,0.5); border:1px solid rgba(96,165,250,0.2);
            border-radius:20px; overflow:hidden; backdrop-filter:blur(10px); transition:all 0.3s;
        }
        .player-card:hover {
            transform:translateY(-8px); border-color:rgba(96,165,250,0.6);
            box-shadow:0 12px 40px rgba(59,130,246,0.2);
        }
        .player-img-wrap { height:220px; overflow:hidden; }
        .player-img { width:100%; height:100%; object-fit:cover; object-position:top; }
        .player-info { padding:20px; }
        .player-name { font-size:22px; font-weight:700; color:#fff; margin-bottom:6px; }
        .player-club { font-size:15px; color:#60a5fa; margin-bottom:12px; }
        .player-meta { display:flex; flex-wrap:wrap; gap:8px; }
        .meta-tag {
            background:rgba(96,165,250,0.15); border:1px solid rgba(96,165,250,0.2);
            padding:4px 12px; border-radius:20px; font-size:13px; color:#bfdbfe;
        }
        footer { text-align:center; padding:60px 20px 40px; color:#64748b; font-size:14px; }
        footer .yz { font-size:20px; font-weight:700; color:#3b82f6; margin-bottom:8px; }
        @media (max-width:768px) {
            .hero h1 { font-size:32px; }
            .search-box { flex-direction:column; }
            #search-btn { width:100%; }
            .players-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
    <div class="yz-badge">yz</div>
    <div class="hero">
        <h1>YZ 足球球员数据库</h1>
        <p>搜索球员 · 查看资料与身价</p>
    </div>
    <div class="search-wrapper">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="输入球员中文名字搜索...">
            <button id="search-btn">搜索</button>
        </div>
    </div>
    <div class="tips-text" id="tip">清空输入框自动恢复全部球员</div>
    <div class="players-grid" id="container"></div>
    <footer>
        <div class="yz">yz</div>
        <p>足球球员数据中心 · 个人作品</p>
    </footer>

    <script>
        const container = document.getElementById("container");
        const input = document.getElementById("search-input");
        const btn = document.getElementById("search-btn");
        const tip = document.getElementById("tip");

        // 本地热门球员（都有图片）
        const defaultPlayers = [
            { name:"梅西", club:"迈阿密国际", league:"美职联", position:"前锋", age:37, value:"3500万欧", photo:"assets/messi.jpg" },
            { name:"C罗", club:"利雅得胜利", league:"沙特联", position:"前锋", age:40, value:"1200万欧", photo:"assets/ronaldo.jpg" },
            { name:"哈兰德", club:"曼城", league:"英超", position:"前锋", age:25, value:"1.8亿欧", photo:"assets/haaland.jpg" },
            { name:"姆巴佩", club:"皇家马德里", league:"西甲", position:"前锋", age:26, value:"1.6亿欧", photo:"assets/mbappe.jpg" },
            { name:"贝林厄姆", club:"皇家马德里", league:"西甲", position:"中场", age:21, value:"1.5亿欧", photo:"assets/bellingham.jpg" },
            { name:"凯恩", club:"拜仁慕尼黑", league:"德甲", position:"前锋", age:31, value:"7500万欧", photo:"assets/kane.jpg" },
            { name:"劳塔罗", club:"国际米兰", league:"意甲", position:"前锋", age:27, value:"8000万欧", photo:"assets/lautaro.jpg" }
        ];

        function renderLocal(list) {
            if (list.length === 0) {
                container.innerHTML = `<p style="text-align:center;width:100%;opacity:0.7;font-size:18px;">没有找到该球员</p>`;
                return;
            }
            container.innerHTML = list.map(p => `
                <div class="player-card">
                    <div class="player-img-wrap">
                        <img class="player-img" src="${p.photo}" alt="${p.name}" onerror="this.parentElement.innerHTML='<div style=&quot;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;&quot;>⚽</div>'">
                    </div>
                    <div class="player-info">
                        <div class="player-name">${p.name}</div>
                        <div class="player-club">${p.club} · ${p.league}</div>
                        <div class="player-meta">
                            <span class="meta-tag">${p.position}</span>
                            <span class="meta-tag">${p.age}岁</span>
                            <span class="meta-tag">身价 ${p.value}</span>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        // 联网搜索（球小策API，通过Netlify代理）
        async function searchOnline(name) {
            tip.innerText = "🔍 联网搜索中...";
            try {
                const res = await fetch(`/.netlify/functions/proxy-football?q=${encodeURIComponent(name)}`);
                const data = await res.json();
                if (data.success && data.data && data.data.length > 0) {
                    tip.innerText = `✅ 联网找到 ${data.data.length} 位球员`;
                    container.innerHTML = data.data.map(p => `
                        <div class="player-card">
                            <div class="player-img-wrap">
                                <img class="player-img" src="${p.photo || ''}" alt="${p.name_zh || p.name}" onerror="this.parentElement.innerHTML='<div style=&quot;height:100%;display:flex;align-items:center;justify-content:center;font-size:48px;&quot;>⚽</div>'">
                            </div>
                            <div class="player-info">
                                <div class="player-name">${p.name_zh || p.name}</div>
                                <div class="player-club">${p.nationality || '未知国籍'}</div>
                                <div class="player-meta">
                                    <span class="meta-tag">${p.age ? p.age + '岁' : ''}</span>
                                </div>
                            </div>
                        </div>
                    `).join("");
                } else {
                    tip.innerText = "❌ 没有搜到该球员";
                    container.innerHTML = "";
                }
            } catch (err) {
                tip.innerText = "⚠️ 联网搜索暂不可用，目前支持搜索本地热门球员";
                console.error(err);
            }
        }

        function doSearch() {
            const kw = input.value.trim();
            if (!kw) {
                tip.innerText = "清空输入框自动恢复全部球员";
                renderLocal(defaultPlayers);
                return;
            }
            // 先本地匹配
            const localResult = defaultPlayers.filter(p => 
                p.name.toLowerCase().includes(kw.toLowerCase())
            );
            if (localResult.length > 0) {
                tip.innerText = `本地找到 ${localResult.length} 位球员`;
                renderLocal(localResult);
            } else {
                // 本地没有 → 走联网！
                searchOnline(kw);
            }
        }

        btn.onclick = doSearch;
        input.onkeydown = (e) => { if (e.key === "Enter") doSearch(); };
        input.oninput = () => {
            if (input.value.trim() === "") {
                tip.innerText = "清空输入框自动恢复全部球员";
                renderLocal(defaultPlayers);
            }
        };

        // 默认显示全部球员
        renderLocal(defaultPlayers);
    </script>
</body>
</html>

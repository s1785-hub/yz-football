<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZ 足球球员查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            color: #fff;
            padding: 28px 16px;
        }
        .yz-badge {
            position: fixed;
            top: 18px;
            right: 18px;
            background: #22c55e;
            color: #000;
            font-weight: 800;
            padding: 7px 14px;
            border-radius: 999px;
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.5);
            z-index: 99;
        }
        .header {
            text-align: center;
            margin-bottom: 36px;
        }
        .header h1 {
            font-size: 34px;
            background: linear-gradient(90deg, #22c55e, #86efac);
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .header p {
            opacity: 0.7;
            font-size: 16px;
        }
        .search-box {
            max-width: 620px;
            margin: 0 auto 20px;
            display: flex;
            gap: 10px;
        }
        #search-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            background: #1e293b;
            color: #fff;
            outline: none;
        }
        #search-input:focus {
            box-shadow: 0 0 0 2px #22c55e;
        }
        #search-btn {
            padding: 0 24px;
            border: none;
            border-radius: 12px;
            background: #22c55e;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #search-btn:hover {
            background: #16a34a;
        }
        .tips-text {
            text-align: center;
            margin-bottom: 20px;
            font-size: 15px;
            opacity: 0.7;
        }
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 24px;
            max-width: 1240px;
            margin: 0 auto;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.25s ease;
            border: 1px solid #334155;
            cursor: pointer;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
            border-color: #22c55e;
        }
        .avatar-wrap {
            height: 200px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-body {
            padding: 18px;
        }
        .card-body h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .tag {
            display: inline-block;
            font-size: 13px;
            padding: 3px 8px;
            border-radius: 6px;
            margin-right: 6px;
            margin-bottom: 6px;
        }
        .team-tag { background: #334155; }
        .pos-tag { background: #1e40af; }
        .value-tag { background: #15803d; }
        footer {
            text-align: center;
            margin-top: 70px;
            opacity: 0.55;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="yz-badge">YZ</div>
    <div class="header">
        <h1>⚽ YZ 足球球员查询系统</h1>
        <p>中文搜索球员 · 实时数据查询</p>
    </div>
    <div class="search-box">
        <input id="search-input" placeholder="输入球员中文名字，如：哈兰德、梅西、姆巴佩">
        <button id="search-btn">搜索</button>
    </div>
    <div class="tips-text" id="tip">输入中文球员名字搜索，清空输入框自动清空结果</div>
    <div class="player-grid" id="container"></div>
    <footer>Powered by YZ | 足球数据演示项目</footer>

    <script>
        const container = document.getElementById("container");
        const input = document.getElementById("search-input");
        const btn = document.getElementById("search-btn");
        const tip = document.getElementById("tip");

        // 调用我们自己的Netlify代理函数
        async function searchPlayer(name) {
            if (!name.trim()) {
                container.innerHTML = "";
                tip.innerText = "输入中文球员名字搜索，清空输入框自动清空结果";
                return;
            }
            tip.innerText = "🔍 正在联网查询，请稍等...";
            container.innerHTML = "";
            try {
                // 关键：走我们自己的代理函数，不是直接请求球小策
                const res = await fetch(`/.netlify/functions/proxy-football?q=${encodeURIComponent(name)}`);
                const data = await res.json();

                if (data.success && data.data && data.data.length > 0) {
                    tip.innerText = `✅ 一共找到 ${data.data.length} 位球员`;
                    renderList(data.data);
                } else {
                    tip.innerText = "❌ 没有搜到该球员，换个名字试试";
                }
            } catch (err) {
                tip.innerText = "⚠️ 代理函数未部署或网络异常，请检查netlify/functions/proxy-football.js是否已上传";
                console.error(err);
            }
        }

        function renderList(list) {
            let html = "";
            list.forEach(p => {
                const avatar = p.photo || "https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Soccer_ball.svg/220px-Soccer_ball.svg.png";
                html += `
                <div class="card">
                    <div class="avatar-wrap">
                        <img src="${avatar}" alt="${p.name_zh || p.name}" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Soccer_ball.svg/220px-Soccer_ball.svg.png'">
                    </div>
                    <div class="card-body">
                        <h3>${p.name_zh || p.name}</h3>
                        <span class="tag team-tag">${p.nationality || '未知国籍'}</span>
                        <span class="tag pos-tag">${p.age ? p.age + '岁' : ''}</span>
                    </div>
                </div>`;
            })
            container.innerHTML = html;
        }

        btn.onclick = () => searchPlayer(input.value.trim());
        input.onkeydown = (e) => {
            if (e.key === "Enter") searchPlayer(input.value.trim());
        };
        input.oninput = () => {
            if (input.value.trim() === "") {
                container.innerHTML = "";
                tip.innerText = "输入中文球员名字搜索，清空输入框自动清空结果";
            }
        }
    </script>
</body>
</html>

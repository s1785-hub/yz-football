<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZ足球球员数据库</title>
    <style>
        * {
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
            color: #fff;
            padding: 28px 16px;
        }
        .yz-badge {
            position: fixed;
            top:18px;
            right:18px;
            background:#22c55e;
            color:#000;
            font-weight:800;
            padding:7px 14px;
            border-radius:999px;
            box-shadow: 0 0 14px rgba(34, 197, 94, 0.5);
            z-index: 99;
        }
        .header {
            text-align:center;
            margin-bottom:36px;
        }
        .header h1{
            font-size:34px;
            background: linear-gradient(90deg,#22c55e,#86efac);
            -webkit-background-clip:text;
            color:transparent;
            margin-bottom:8px;
        }
        .header p{
            opacity:0.7;
            font-size:16px;
        }
        .search-box {
            max-width:620px;
            margin:0 auto 40px;
            display:flex;
            gap:10px;
        }
        #search-input {
            flex:1;
            padding:14px 18px;
            border-radius:12px;
            border:none;
            font-size:17px;
            background:#1e293b;
            color:#fff;
            outline:none;
        }
        #search-input:focus{
            box-shadow:0 0 0 2px #22c55e;
        }
        #search-btn {
            padding:0 24px;
            border:none;
            border-radius:12px;
            background:#22c55e;
            color:#000;
            font-weight:bold;
            font-size:16px;
            cursor:pointer;
            transition:0.2s;
        }
        #search-btn:hover{
            background:#16a34a;
        }
        .player-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(270px,1fr));
            gap:24px;
            max-width:1240px;
            margin:0 auto;
        }
        .card {
            background:#1e293b;
            border-radius:16px;
            overflow:hidden;
            transition: 0.25s ease;
            border:1px solid #334155;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 28px rgba(0,0,0,0.35);
            border-color:#22c55e;
        }
        .avatar-wrap{
            height:220px;
            background:#0f172a;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
        }
        .avatar-wrap img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .card-body {
            padding:18px;
        }
        .card-body h3{
            font-size:22px;
            margin-bottom:10px;
        }
        .tag{
            display:inline-block;
            font-size:13px;
            padding:3px 8px;
            border-radius:6px;
            margin-right:6px;
            margin-bottom:6px;
        }
        .team-tag{
            background:#334155;
        }
        .pos-tag{
            background:#1e40af;
        }
        .value-tag{
            background:#15803d;
        }
        footer {
            text-align:center;
            margin-top:70px;
            opacity:0.55;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="yz-badge">YZ</div>
    <div class="header">
        <h1>⚽ YZ 足球球员查询系统</h1>
        <p>搜索球员 · 查看资料与身价</p>
    </div>
    <div class="search-box">
        <input id="search-input" placeholder="输入球员名字：哈兰德、梅西、贝林厄姆">
        <button id="search-btn">搜索</button>
    </div>
    <div class="player-grid" id="container"></div>
    <footer>Powered by YZ | 足球数据演示项目</footer>

    <script>
        const container = document.getElementById("container");
        const input = document.getElementById("search-input");
        const btn = document.getElementById("search-btn");

        // 这里：头像路径 assets/xxx.jpg  对应你上传到github的图片
        const playerList = [
            {name:"哈兰德",team:"曼城",pos:"前锋",value:"1.8亿欧",img:"assets/haaland.jpg"},
            {name:"姆巴佩",team:"皇家马德里",pos:"前锋",value:"1.6亿欧",img:"assets/mbappe.jpg"},
            {name:"梅西",team:"迈阿密国际",pos:"前锋",value:"3500万欧",img:"assets/messi.jpg"},
            {name:"C罗",team:"利雅得胜利",pos:"前锋",value:"1200万欧",img:"assets/c罗.jpg"},
            {name:"贝林厄姆",team:"皇家马德里",pos:"中场",value:"1.5亿欧",img:"assets/bellingham.jpg"},
            {name:"维尼修斯",team:"皇家马德里",pos:"前锋",value:"1.4亿欧",img:"assets/vinicius.jpg"},
            {name:"德布劳内",team:"曼城",pos:"中场",value:"7000万欧",img:"assets/debruyne.jpg"},
            {name:"萨拉赫",team:"利物浦",pos:"前锋",value:"6500万欧",img:"assets/salah.jpg"},
            {name:"凯恩",team:"拜仁慕尼黑",pos:"前锋",value:"7000万欧",img:"assets/kane.jpg"},
            {name:"赖斯",team:"阿森纳",pos:"中场",value:"9000万欧",img:"assets/rice.jpg"},
            {name:"萨卡",team:"阿森纳",pos:"前锋",value:"1.1亿欧",img:"assets/saka.jpg"},
            {name:"帕尔默",team:"切尔西",pos:"中场",value:"9500万欧",img:"assets/palmer.jpg"}
        ]

        function render(list){
            container.innerHTML = "";
            if(list.length === 0){
                container.innerHTML = `<p style="text-align:center;width:100%;opacity:0.7;font-size:18px;">没有找到该球员</p>`
                return;
            }
            list.forEach(p=>{
                container.innerHTML += `
                <div class="card">
                    <div class="avatar-wrap">
                        <img src="${p.img}" alt="${p.name}" onerror="this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Soccer_ball.svg/220px-Soccer_ball.svg.png'">
                    </div>
                    <div class="card-body">
                        <h3>${p.name}</h3>
                        <span class="tag team-tag">${p.team}</span>
                        <span class="tag pos-tag">${p.pos}</span>
                        <span class="tag value-tag">💰${p.value}</span>
                    </div>
                </div>`
            })
        }
        render(playerList);

        function searchPlayer(){
            const kw = input.value.trim().toLowerCase();
            if(!kw){
                render(playerList);
                return;
            }
            const result = playerList.filter(item=> item.name.toLowerCase().includes(kw))
            render(result);
        }
        btn.onclick = searchPlayer;
        input.onkeydown = (e)=>e.key === "Enter" && searchPlayer();
    </script>
</body>
</html>
